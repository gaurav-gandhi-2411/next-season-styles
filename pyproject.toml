[project]
name = "nss"
version = "0.1.0"
description = "H&M fashion trend forecasting + generation pipeline (technical assignment)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pandas>=2.2,<3.0",
    "polars>=1.9,<2.0",
    "pyarrow>=17.0,<19.0",
    "lightgbm>=4.5,<5.0",
    "scikit-learn>=1.5,<1.6",
    "shap>=0.48,<0.51",
    "matplotlib>=3.9,<3.10",
    "pillow>=10.4,<11.0",
    "kaggle>=1.6,<2.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-cov>=5.0,<6.0",
    "ruff>=0.6,<0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nss"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.report]
omit = ["notebooks/*", "scripts/*"]
