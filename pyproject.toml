[project]
name = "nss"
version = "0.1.0"
description = "H&M fashion trend forecasting and concept generation pipeline."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pandas>=2.2,<3.0",
    "polars>=1.9,<2.0",
    "pyarrow>=17.0,<19.0",
    "lightgbm>=4.5,<5.0",
    "scikit-learn>=1.5,<1.6",
    "shap>=0.48,<0.51",
    "matplotlib>=3.9,<3.10",
    "pillow>=10.4,<11.0",
    "kaggle>=1.6,<2.1",
    "sentence-transformers>=6.1.0",
    "diffusers>=0.40.0",
    "compel>=2.4.0",  # prompt weighting of the briefed change clauses (task N1)
    "transformers>=5.17.0",
    "accelerate>=1.15.0",
    "safetensors>=0.8.0",
    "controlnet-aux>=0.0.10",
    "peft>=0.21.0",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "google-genai>=2.24.0",
    "python-dotenv>=1.2.3",
    "mcp>=2.2.0",
    "groq>=1.7.0",
    "fastapi>=0.115",
    "pandera[polars]>=0.22",
    "pyyaml>=6.0",
    "fsspec>=2024.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-cov>=5.0,<6.0",
    "ruff>=0.6,<0.7",
]
# The production path (`nss.prod`) only: no torch, diffusers or plotting stack. Installed on its
# own (`uv sync --only-group serving`) in the Docker image, with `src/` on PYTHONPATH.
serving = [
    "numpy>=2.0,<3.0",
    "scipy>=1.14,<2.0",
    "polars>=1.9,<2.0",
    "pyarrow>=17.0,<19.0",
    "lightgbm>=4.5,<5.0",
    "scikit-learn>=1.5,<1.6",  # lightgbm's sklearn API (LGBMRegressor) needs it
    "pydantic>=2.7,<3.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pandera[polars]>=0.22",
    "pyyaml>=6.0",
    "fsspec>=2024.6",
]
# CI: the serving set plus the test and lint tools. No dataset, no GPU stack (see .github/).
ci = [
    { include-group = "serving" },
    "pytest>=8.3,<9.0",
    "httpx>=0.27",  # fastapi.testclient
    "ruff>=0.6,<0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nss"]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.report]
omit = ["notebooks/*", "scripts/*"]
