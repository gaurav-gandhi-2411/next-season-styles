# CI for the production path (SPEC Phase C1). No secrets, no dataset: every job runs on the
# committed code and the committed toy panel only.
name: ci

on:
  push:
    branches: [feat/v3-improvements]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: tests, lint, champion/challenger gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.14"
          python-version: "3.13"
      - name: Install the light `ci` group (no torch, image or LLM stack)
        run: uv sync --frozen --only-group ci
      - name: Data-free test suite
        # Modules needing the concept/image/LLM stack are listed, with reasons, in
        # tests/ci_light_excluded.txt; the full suite runs locally.
        env:
          NSS_CI_LIGHT: "1"
          PYTHONPATH: src
        run: uv run --no-sync pytest -q
      - name: Ruff lint
        run: uv run --no-sync ruff check .
      - name: Ruff format
        run: uv run --no-sync ruff format --check .
      - name: Champion/challenger gate on the synthetic fixture
        # must accept the improving challenger and refuse the guardrail-breaking and no-effect ones
        env:
          PYTHONPATH: src
        run: uv run --no-sync python -m nss.prod.cli gate-fixture

  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan the full history
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz gitleaks
          ./gitleaks git --no-banner --redact --exit-code 1 .

  docker:
    name: docker build and container smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t nss-forecaster:ci .
      - name: Without a model, /healthz is 503
        run: |
          docker run -d --name nomodel -p 8081:8080 nss-forecaster:ci
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8081/healthz || true)
            [ "$code" = "503" ] && echo "503 as expected" && exit 0
            sleep 1
          done
          docker logs nomodel; exit 1
      - name: With a toy artifact, /healthz is 200 and a forecast returns
        run: |
          docker run -d --name toy -p 8082:8080 -e NSS_ARTIFACT_DIR=/tmp/toy nss-forecaster:ci \
            sh -c "python -c 'from pathlib import Path; from nss.prod.fixture import build_toy_artifact; build_toy_artifact(Path(\"/tmp\"))' && exec uvicorn nss.prod.api:app --host 0.0.0.0 --port 8080"
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8082/healthz && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8082/healthz | grep -q '"model_version":"toy"'
          docker exec toy python -c "
          import json, urllib.request
          import polars as pl
          from nss.prod.api import PANEL_SCHEMA
          from nss.prod.fixture import toy_panel
          p = toy_panel()
          keys = p.filter(pl.col('week_start') == pl.date(2020, 6, 22))['style_key'].unique().sort().head(10)
          rows = json.loads(p.filter(pl.col('style_key').is_in(keys.implode()) & (pl.col('week_start') <= pl.date(2020, 6, 22))).select(list(PANEL_SCHEMA)).write_json())
          req = urllib.request.Request('http://127.0.0.1:8080/v1/forecast', data=json.dumps({'as_of': '2020-06-22', 'rows': rows}).encode(), headers={'Content-Type': 'application/json'})
          body = json.load(urllib.request.urlopen(req))
          assert body['n_styles'] == 10 and body['forecasts'][0]['rank'] == 1, body
          assert 'Long-run 80%' in body['forecasts'][0]['interval_semantics']
          print('forecast OK:', body['n_styles'], 'styles')
          "
